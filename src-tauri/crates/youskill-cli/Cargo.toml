[package]
name = "youskill-cli"
version.workspace = true
edition = "2021"
description = "Command line interface for the YouSkill hub"
publish = false

[[bin]]
name = "youskill"
path = "src/main.rs"

[dependencies]
youskill-core = { path = "../youskill-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
