<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouSkill</title>
    <script>
      // Runs before the first paint: the app styles and settings load later, so apply the
      // cached theme and list width now to keep the boot skeleton consistent with the app.
      (() => {
        const root = document.documentElement;
        let theme = "system";
        let listWidth = 0;
        try {
          theme = localStorage.getItem("youskill.theme") || "system";
          listWidth = Number(localStorage.getItem("youskill.listPaneWidth"));
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) root.dataset.theme = "dark";
        else delete root.dataset.theme;
        if (Number.isFinite(listWidth) && listWidth > 0) {
          root.style.setProperty(
            "--boot-list-width",
            `${Math.round(Math.min(480, Math.max(220, listWidth)))}px`
          );
        }
      })();
    </script>
    <style>
      /* Boot skeleton. app.css is not loaded yet, so these colors mirror its theme tokens and
         the sizes mirror AppTopBar, SkillList and the content panel. */
      :root {
        color-scheme: light;
        --boot-content: oklch(21% 0.006 285.885);
        --boot-chrome: oklch(96.4% 0.002 286);
        --boot-panel: oklch(100% 0 0);
        --boot-border: oklch(95% 0 0);
        --boot-raised: oklch(100% 0 0);
        background-color: var(--boot-chrome);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --boot-content: oklch(0.934 0 0);
        --boot-chrome: oklch(0.195 0 0);
        --boot-panel: oklch(0.2308 0 0);
        --boot-border: oklch(0.3268 0.0055 236.68);
        --boot-raised: oklch(0.3268 0.0055 236.68);
      }
      #boot-skeleton {
        --boot-text: color-mix(in oklch, var(--boot-content) 9%, transparent);
        --boot-text-faint: color-mix(in oklch, var(--boot-content) 6%, transparent);
        --boot-track: color-mix(in oklch, var(--boot-content) 5.5%, transparent);
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        color: var(--boot-content);
        background-color: var(--boot-chrome);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        cursor: default;
        user-select: none;
      }
      #boot-skeleton * {
        box-sizing: border-box;
      }
      .boot-topbar {
        display: grid;
        flex: none;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        height: 60px;
        padding: 0 16px 0 5.75rem;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 16px;
        font-weight: 500;
        font-style: italic;
        letter-spacing: -0.03em;
      }
      .boot-brand svg {
        width: auto;
        height: 25px;
      }
      .boot-nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .boot-track {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 36px;
        padding: 3px;
        border-radius: 999px;
        background-color: var(--boot-track);
      }
      .boot-tab {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 12px;
        border-radius: 999px;
      }
      .boot-tab.boot-active {
        background-color: var(--boot-raised);
        box-shadow:
          0 1px 2px 0 color-mix(in oklch, var(--boot-content) 10%, transparent),
          0 0 0 0.5px color-mix(in oklch, var(--boot-content) 8%, transparent);
      }
      .boot-circle {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background-color: var(--boot-track);
      }
      .boot-main {
        display: grid;
        flex: 1;
        grid-template-columns: var(--boot-list-width, 288px) minmax(0, 1fr);
        min-height: 0;
        padding: 0 8px 8px;
      }
      .boot-list {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .boot-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 16px;
      }
      .boot-row-flex {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .boot-field {
        height: 32px;
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        background-color: var(--boot-panel);
      }
      .boot-filters {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 12px 10px;
      }
      /* SelectField reserves 36px for its sizer while the visible select is 32px. */
      .boot-filters .boot-row-flex {
        align-items: flex-start;
        height: 36px;
      }
      .boot-filters .boot-row-flex > .boot-field {
        flex: 1;
      }
      .boot-items {
        padding: 6px 0;
      }
      .boot-group {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px 4px;
      }
      /* Text bars sit centered in the line boxes of the real 13px name and 11px description. */
      .boot-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0 6px;
        padding: 8px 10px 8px 28px;
      }
      .boot-item > :first-child {
        margin: 4.5px 0;
      }
      .boot-item > :last-child {
        margin: 3.5px 0;
      }
      .boot-panel {
        display: flex;
        align-items: center;
        justify-content: center;
        /* The empty detail view centers its hint below a 48px header. */
        padding-top: 48px;
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        background-color: var(--boot-panel);
        box-shadow: 0 1px 2px 0 color-mix(in oklch, var(--boot-content) 5%, transparent);
      }
      .boot-text {
        flex: none;
        height: 10px;
        border-radius: 999px;
        background-color: var(--boot-text);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-text.boot-faint {
        background-color: var(--boot-text-faint);
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-text {
          animation: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-skeleton" aria-hidden="true">
      <div class="boot-topbar">
        <div class="boot-brand">
          <svg viewBox="0 0 433 455" fill="currentColor">
            <path d="M0 263.506L265.588 0L205.547 180.705H433L153.889 455L217.987 263.506H0Z" />
          </svg>
          YouSkill
        </div>
        <div class="boot-nav">
          <div class="boot-track">
            <div class="boot-tab boot-active">
              <span class="boot-text" style="width: 95px"></span>
            </div>
            <div class="boot-tab"><span class="boot-text boot-faint" style="width: 93px"></span></div>
            <div class="boot-tab"><span class="boot-text boot-faint" style="width: 71px"></span></div>
          </div>
          <div class="boot-circle"></div>
          <div class="boot-circle"></div>
        </div>
        <div class="boot-row-flex" style="justify-content: flex-end; padding-right: 9px">
          <span class="boot-text boot-faint" style="width: 18px; height: 18px"></span>
        </div>
      </div>
      <div class="boot-main">
        <div class="boot-list">
          <div class="boot-list-header">
            <div class="boot-row-flex">
              <span class="boot-text" style="width: 88px; height: 14px"></span>
              <span class="boot-text boot-faint" style="width: 44px; height: 9px"></span>
            </div>
            <div class="boot-row-flex">
              <div class="boot-field" style="width: 32px"></div>
              <div class="boot-field" style="width: 32px"></div>
            </div>
          </div>
          <div class="boot-filters">
            <div class="boot-field"></div>
            <div class="boot-row-flex">
              <div class="boot-field"></div>
              <div class="boot-field"></div>
            </div>
          </div>
          <div class="boot-items">
            <div class="boot-group">
              <span class="boot-text boot-faint" style="width: 12px; height: 12px"></span>
              <span class="boot-text boot-faint" style="width: 16px; height: 16px"></span>
              <span class="boot-text boot-faint" style="width: 52%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 46%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 86%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 30%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 88%; height: 9px"></span>
            </div>
            <div class="boot-group">
              <span class="boot-text boot-faint" style="width: 12px; height: 12px"></span>
              <span class="boot-text boot-faint" style="width: 16px; height: 16px"></span>
              <span class="boot-text boot-faint" style="width: 44%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 54%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 84%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 40%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 90%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 58%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 82%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 36%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 86%; height: 9px"></span>
            </div>
            <div class="boot-item">
              <span class="boot-text" style="width: 50%; height: 11px"></span>
              <span class="boot-text boot-faint" style="width: 88%; height: 9px"></span>
            </div>
          </div>
        </div>
        <div class="boot-panel">
          <span class="boot-text boot-faint" style="width: 220px"></span>
        </div>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
