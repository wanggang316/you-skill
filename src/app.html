<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouSkill</title>
    <script>
      // Runs before the first paint: the app styles and settings load later, so apply the
      // cached theme and list width now to keep the boot skeleton consistent with the app.
      (() => {
        const root = document.documentElement;
        let theme = "system";
        let listWidth = 0;
        try {
          theme = localStorage.getItem("youskill.theme") || "system";
          listWidth = Number(localStorage.getItem("youskill.listPaneWidth"));
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) root.dataset.theme = "dark";
        else delete root.dataset.theme;
        if (Number.isFinite(listWidth) && listWidth > 0) {
          root.style.setProperty(
            "--boot-list-width",
            `${Math.round(Math.min(480, Math.max(220, listWidth)))}px`
          );
        }
      })();
    </script>
    <style>
      /* Boot skeleton. app.css is not loaded yet, so these colors mirror its theme tokens. */
      :root {
        color-scheme: light;
        --boot-chrome: oklch(96.4% 0.002 286);
        --boot-panel: oklch(100% 0 0);
        --boot-border: oklch(95% 0 0);
        --boot-block: color-mix(in oklch, oklch(21% 0.006 285.885) 8%, transparent);
        background-color: var(--boot-chrome);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --boot-chrome: oklch(0.195 0 0);
        --boot-panel: oklch(0.2308 0 0);
        --boot-border: oklch(0.3268 0.0055 236.68);
        --boot-block: color-mix(in oklch, oklch(0.934 0 0) 10%, transparent);
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        background-color: var(--boot-chrome);
        cursor: default;
        user-select: none;
      }
      #boot-skeleton .boot-topbar {
        display: grid;
        flex: none;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        height: 60px;
        padding: 0 16px 0 5.75rem;
      }
      #boot-skeleton .boot-main {
        display: grid;
        flex: 1;
        grid-template-columns: var(--boot-list-width, 288px) minmax(0, 1fr);
        min-height: 0;
        padding: 0 8px 8px;
      }
      #boot-skeleton .boot-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 12px;
        overflow: hidden;
      }
      #boot-skeleton .boot-panel {
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        background-color: var(--boot-panel);
      }
      #boot-skeleton .boot-block {
        border-radius: 6px;
        background-color: var(--boot-block);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-skeleton .boot-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px 8px 16px;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton .boot-block {
          animation: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-skeleton" aria-hidden="true">
      <div class="boot-topbar">
        <div class="boot-block" style="width: 112px; height: 22px"></div>
        <div class="boot-block" style="width: 320px; height: 36px; border-radius: 999px"></div>
        <div></div>
      </div>
      <div class="boot-main">
        <div class="boot-list">
          <div class="boot-block" style="width: 45%; height: 18px; margin: 2px 4px 8px"></div>
          <div class="boot-block" style="height: 32px; border-radius: 12px"></div>
          <div class="boot-block" style="height: 32px; border-radius: 12px"></div>
          <div class="boot-row">
            <div class="boot-block" style="width: 62%; height: 12px"></div>
            <div class="boot-block" style="width: 88%; height: 10px"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="width: 48%; height: 12px"></div>
            <div class="boot-block" style="width: 80%; height: 10px"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="width: 70%; height: 12px"></div>
            <div class="boot-block" style="width: 92%; height: 10px"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="width: 55%; height: 12px"></div>
            <div class="boot-block" style="width: 76%; height: 10px"></div>
          </div>
          <div class="boot-row">
            <div class="boot-block" style="width: 64%; height: 12px"></div>
            <div class="boot-block" style="width: 84%; height: 10px"></div>
          </div>
        </div>
        <div class="boot-panel"></div>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
